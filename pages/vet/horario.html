<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PetVission — Mi Horario</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet"/>
<style>
:root {
  --teal:#1a9e8f; --teal-dark:#137a6e; --teal-light:#e6f7f5; --teal-mid:#5bbdb5;
  --pink:#f472b6; --pink-light:#fdf2f8;
  --amber:#f59e0b; --amber-light:#fffbeb;
  --purple:#7c3aed; --purple-light:#f5f3ff;
  --sky:#0ea5e9; --sky-light:#f0f9ff;
  --green:#16a34a; --green-light:#f0fdf4;
  --red:#dc2626; --red-light:#fef2f2;
  --slate:#334155; --slate-light:#f8fafc;
  --gray-border:#e2e8f0; --white:#fff;
  --sidebar-w:230px;
  --font-body:'DM Sans',sans-serif;
  --font-display:'Nunito',sans-serif;
  --shadow-sm:0 1px 3px rgba(0,0,0,.07);
  --shadow-md:0 4px 16px rgba(0,0,0,.09);
  --shadow-lg:0 12px 40px rgba(0,0,0,.14);
  --radius:10px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{font-family:var(--font-body);background:#f1f5f9;color:var(--slate);font-size:13.5px;}

/* ══ LAYOUT ══ */
.vet-layout{display:flex;height:100vh;overflow:hidden;}

/* ══ SIDEBAR ══ */
.vet-sidebar{
  width:var(--sidebar-w);flex-shrink:0;
  background:linear-gradient(180deg,#085e75 0%,#134e4a 100%);
  color:white;display:flex;flex-direction:column;
  box-shadow:4px 0 20px rgba(0,0,0,.12);z-index:100;
  transition:transform .25s ease;
}
.vet-sidebar-brand{padding:20px 18px 16px;border-bottom:1px solid rgba(255,255,255,.1);}
.brand-icon{width:36px;height:36px;background:rgba(255,255,255,.2);border-radius:10px;display:grid;place-items:center;font-size:1rem;}
.brand-name{font-family:var(--font-display);font-weight:900;font-size:.95rem;letter-spacing:.01em;}
.brand-sub{font-size:.67rem;opacity:.6;margin-top:1px;}

.vet-nav{flex:1;padding:12px 10px;display:flex;flex-direction:column;gap:2px;overflow-y:auto;}
.vet-nav::-webkit-scrollbar{display:none;}
.vet-nav-link{
  display:flex;align-items:center;gap:10px;padding:9px 12px;
  border-radius:8px;color:rgba(255,255,255,.7);text-decoration:none;
  font-size:.8rem;font-weight:600;transition:all .15s;
}
.vet-nav-link:hover{background:rgba(255,255,255,.12);color:white;}
.vet-nav-link.active{background:rgba(255,255,255,.18);color:white;box-shadow:inset 0 0 0 1px rgba(255,255,255,.15);}
.vet-nav-link i{font-size:1rem;width:18px;text-align:center;}
.nav-badge{background:#f59e0b;color:white;font-size:.58rem;font-weight:800;padding:1px 5px;border-radius:8px;margin-left:auto;}

.vet-sidebar-footer{padding:14px 16px;border-top:1px solid rgba(255,255,255,.1);}
.vet-avatar{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.25);display:grid;place-items:center;font-size:.75rem;font-weight:800;color:white;flex-shrink:0;}
.footer-name{font-size:.78rem;font-weight:700;color:white;}
.footer-email{font-size:.65rem;opacity:.55;color:white;}

/* Mobile overlay */
.vet-sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:99;}
@media(max-width:768px){
  .vet-sidebar{position:fixed;top:0;left:0;height:100%;transform:translateX(-100%);}
  .vet-sidebar.open{transform:translateX(0);}
  .vet-sidebar-overlay.open{display:block;}
}

/* ══ MAIN ══ */
.vet-main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;}

/* ══ TOPBAR ══ */
.vet-topbar{
  background:var(--white);border-bottom:1px solid var(--gray-border);
  height:56px;padding:0 24px;display:flex;align-items:center;gap:14px;
  flex-shrink:0;z-index:50;
}
.topbar-hamburger{display:none;background:none;border:none;font-size:1.2rem;cursor:pointer;color:var(--slate);}
@media(max-width:768px){.topbar-hamburger{display:block;}}
.topbar-title{font-family:var(--font-display);font-weight:800;font-size:1rem;color:var(--slate);}
.topbar-subtitle{font-size:.72rem;color:#94a3b8;font-weight:500;}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:8px;}
.topbar-btn{border:1.5px solid var(--gray-border);background:white;border-radius:8px;padding:6px 13px;font-size:.75rem;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:5px;color:var(--slate);transition:all .15s;font-family:var(--font-body);}
.topbar-btn:hover{border-color:var(--teal);color:var(--teal);background:var(--teal-light);}
.topbar-btn.btn-swap{background:var(--teal-light);color:var(--teal);border-color:var(--teal-mid);}
.topbar-btn.btn-swap:hover{background:var(--teal);color:white;}
.topbar-btn.btn-vacaciones{background:var(--amber-light);color:#92400e;border-color:#fcd34d;}
.topbar-btn.btn-vacaciones:hover{background:var(--amber);color:white;border-color:var(--amber);}

/* ══ CONTENT AREA ══ */
.vet-content{flex:1;overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;gap:16px;}
.vet-content::-webkit-scrollbar{width:6px;}
.vet-content::-webkit-scrollbar-thumb{background:var(--gray-border);border-radius:3px;}

/* ══ SUMMARY CARDS ══ */
.summary-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
.sum-card{background:var(--white);border:1px solid var(--gray-border);border-radius:var(--radius);padding:14px 16px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow-sm);}
.sum-icon{width:40px;height:40px;border-radius:9px;display:grid;place-items:center;font-size:1.1rem;flex-shrink:0;}
.sum-label{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#94a3b8;margin-bottom:2px;}
.sum-value{font-family:var(--font-display);font-weight:900;font-size:1.35rem;color:var(--slate);line-height:1;}
.sum-sub{font-size:.67rem;color:#94a3b8;margin-top:2px;}

/* ══ VIEW TABS ══ */
.view-bar{display:flex;align-items:center;gap:10px;}
.view-tabs{display:flex;border:1px solid var(--gray-border);border-radius:8px;overflow:hidden;background:var(--white);}
.view-tab{border:none;background:none;padding:7px 18px;font-size:.75rem;font-weight:700;color:#94a3b8;cursor:pointer;transition:all .15s;font-family:var(--font-body);}
.view-tab.active{background:var(--teal);color:white;}
.nav-arrows{display:flex;gap:3px;}
.nav-arrow{border:1px solid var(--gray-border);background:white;border-radius:6px;width:28px;height:28px;display:grid;place-items:center;cursor:pointer;font-size:.85rem;color:var(--slate);transition:all .15s;}
.nav-arrow:hover{background:var(--teal-light);border-color:var(--teal);color:var(--teal);}
.period-label{font-family:var(--font-display);font-weight:800;font-size:.95rem;color:var(--slate);}
.btn-today{border:1px solid var(--gray-border);background:white;border-radius:6px;padding:5px 12px;font-size:.73rem;font-weight:700;color:var(--slate);cursor:pointer;font-family:var(--font-body);}
.btn-today:hover{background:var(--teal-light);border-color:var(--teal);color:var(--teal);}

/* ══ DAY VIEW ══ */
.day-view{display:grid;grid-template-columns:1fr 280px;gap:14px;flex:1;}

.day-timeline{background:var(--white);border:1px solid var(--gray-border);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;}
.timeline-header{padding:12px 16px;border-bottom:1px solid var(--gray-border);background:var(--slate-light);display:flex;align-items:center;gap:8px;}
.timeline-date-big{font-family:var(--font-display);font-weight:900;font-size:1.4rem;color:var(--teal);line-height:1;}
.timeline-day-name{font-weight:700;font-size:.82rem;color:var(--slate);}
.timeline-date-sub{font-size:.7rem;color:#94a3b8;}
.timeline-body{flex:1;overflow-y:auto;padding:0;}
.timeline-body::-webkit-scrollbar{width:4px;}
.timeline-body::-webkit-scrollbar-thumb{background:var(--gray-border);}

.tl-row{display:flex;min-height:64px;border-bottom:1px solid #f1f5f9;}
.tl-time{width:56px;flex-shrink:0;padding:8px 6px 0;text-align:right;font-size:.65rem;font-weight:700;color:#cbd5e1;border-right:1px solid #f1f5f9;}
.tl-slot{flex:1;padding:4px 8px;position:relative;}
.tl-event{border-radius:7px;padding:8px 11px;margin-bottom:4px;cursor:pointer;transition:all .15s;position:relative;}
.tl-event:hover{filter:brightness(.95);transform:translateX(2px);}
.tl-ev-title{font-weight:800;font-size:.8rem;}
.tl-ev-type{font-size:.68rem;opacity:.75;margin-top:1px;}
.tl-ev-time{font-size:.65rem;opacity:.65;margin-top:2px;}
.tl-ev-badge{display:inline-block;font-size:.58rem;font-weight:800;padding:1px 5px;border-radius:6px;margin-top:3px;text-transform:uppercase;letter-spacing:.04em;}
.tl-now-line{height:2px;background:var(--red);position:relative;margin:0 8px;}
.tl-now-line::before{content:'';width:8px;height:8px;background:var(--red);border-radius:50%;position:absolute;left:-4px;top:-3px;}

/* Right panel - day */
.day-right{display:flex;flex-direction:column;gap:12px;}
.info-card{background:var(--white);border:1px solid var(--gray-border);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow-sm);}
.ic-title{font-family:var(--font-display);font-weight:800;font-size:.82rem;color:var(--slate);margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.ic-title i{color:var(--teal);}
.next-event{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--gray-border);}
.next-event:last-child{border-bottom:none;padding-bottom:0;}
.ne-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:4px;}
.ne-title{font-weight:700;font-size:.78rem;color:var(--slate);}
.ne-meta{font-size:.68rem;color:#94a3b8;margin-top:1px;}
.ne-time{font-size:.7rem;font-weight:800;color:var(--teal);white-space:nowrap;margin-left:auto;}

.turno-badge{display:flex;align-items:center;gap:8px;background:var(--teal-light);border:1.5px solid var(--teal-mid);border-radius:8px;padding:10px 12px;margin-bottom:8px;}
.turno-badge i{color:var(--teal);font-size:1rem;}
.turno-badge .tb-label{font-size:.68rem;font-weight:700;text-transform:uppercase;color:#94a3b8;}
.turno-badge .tb-value{font-weight:800;font-size:.82rem;color:var(--teal-dark);}

/* ══ WEEK VIEW ══ */
.week-view{background:var(--white);border:1px solid var(--gray-border);border-radius:var(--radius);flex:1;display:flex;flex-direction:column;overflow:hidden;}
.week-col-header{display:grid;border-bottom:1px solid var(--gray-border);background:var(--slate-light);position:sticky;top:0;z-index:5;}
.wch-time{width:56px;flex-shrink:0;border-right:1px solid var(--gray-border);padding:8px 0;}
.wch-day{flex:1;text-align:center;padding:8px 4px;border-right:1px solid var(--gray-border);cursor:pointer;}
.wch-day:last-child{border-right:none;}
.wch-day .dn{font-size:.62rem;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:#94a3b8;}
.wch-day .dd{font-family:var(--font-display);font-weight:900;font-size:1.05rem;color:var(--slate);line-height:1.2;}
.wch-day.today .dd{background:var(--teal);color:white;width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:.88rem;}
.week-body{display:flex;overflow-y:auto;flex:1;}
.week-body::-webkit-scrollbar{width:5px;}
.week-body::-webkit-scrollbar-thumb{background:var(--gray-border);}
.wb-times{width:56px;flex-shrink:0;border-right:1px solid var(--gray-border);}
.wb-time-cell{height:56px;border-bottom:1px solid #f1f5f9;display:flex;align-items:flex-start;justify-content:center;padding-top:4px;}
.wb-time-cell span{font-size:.62rem;font-weight:700;color:#cbd5e1;}
.wb-days{flex:1;display:flex;}
.wb-day-col{flex:1;border-right:1px solid var(--gray-border);position:relative;min-height:560px;}
.wb-day-col:last-child{border-right:none;}
.wb-hour-line{height:56px;border-bottom:1px solid #f1f5f9;}
.wk-event{position:absolute;left:3px;right:3px;border-radius:6px;padding:4px 7px;cursor:pointer;overflow:hidden;transition:all .15s;z-index:2;}
.wk-event:hover{z-index:5;filter:brightness(.95);box-shadow:var(--shadow-md);}
.wk-ev-title{font-weight:800;font-size:.7rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.wk-ev-time{font-size:.62rem;opacity:.7;margin-top:1px;}

/* ══ MONTH VIEW ══ */
.month-view{background:var(--white);border:1px solid var(--gray-border);border-radius:var(--radius);flex:1;display:flex;flex-direction:column;overflow:hidden;}
.month-dow-row{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--gray-border);background:var(--slate-light);}
.month-dow{text-align:center;padding:8px;font-size:.62rem;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:#94a3b8;}
.month-grid{flex:1;display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:minmax(80px,1fr);overflow-y:auto;}
.month-grid::-webkit-scrollbar{width:5px;}
.month-grid::-webkit-scrollbar-thumb{background:var(--gray-border);}
.month-cell{border-right:1px solid var(--gray-border);border-bottom:1px solid var(--gray-border);padding:5px 4px;overflow:hidden;cursor:pointer;transition:background .1s;}
.month-cell:hover{background:#f8fafc;}
.month-cell:nth-child(7n){border-right:none;}
.mc-day-num{font-family:var(--font-display);font-weight:800;font-size:.8rem;width:22px;height:22px;display:flex;align-items:center;justify-content:center;border-radius:50%;margin-bottom:3px;color:var(--slate);}
.mc-day-num.today{background:var(--teal);color:white;}
.mc-day-num.other{color:#cbd5e1;}
.mc-event{font-size:.63rem;font-weight:700;padding:2px 5px;border-radius:4px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mc-work-bar{height:4px;border-radius:2px;margin-bottom:2px;}

/* Event color system */
.ev-teal{background:#ccf2ec;color:#0d6e63;}
.ev-amber{background:#fef3c7;color:#92400e;}
.ev-pink{background:#fce7f3;color:#9d174d;}
.ev-purple{background:#ede9fe;color:#5b21b6;}
.ev-sky{background:#e0f2fe;color:#075985;}
.ev-green{background:#dcfce7;color:#14532d;}
.ev-red{background:#fee2e2;color:#991b1b;}
.ev-slate{background:#f1f5f9;color:#334155;}

/* ══ EVENT POPUP ══ */
.ev-popup{position:fixed;background:white;border-radius:12px;box-shadow:var(--shadow-lg);width:290px;z-index:300;overflow:hidden;animation:popIn .15s ease-out;}
@keyframes popIn{from{opacity:0;transform:scale(.94) translateY(-4px)}to{opacity:1;transform:scale(1) translateY(0)}}
.evp-head{padding:12px 14px;display:flex;gap:10px;align-items:flex-start;}
.evp-color-bar{width:4px;border-radius:2px;align-self:stretch;flex-shrink:0;}
.evp-title{font-family:var(--font-display);font-weight:900;font-size:.9rem;color:var(--slate);}
.evp-type{font-size:.72rem;color:#94a3b8;margin-top:2px;}
.evp-close{margin-left:auto;background:none;border:none;cursor:pointer;color:#94a3b8;font-size:1rem;padding:0;line-height:1;}
.evp-body{padding:0 14px 12px;border-top:1px solid var(--gray-border);}
.evp-row{display:flex;align-items:flex-start;gap:8px;padding:7px 0;border-bottom:1px solid #f8fafc;font-size:.77rem;color:var(--slate);}
.evp-row:last-child{border-bottom:none;}
.evp-row i{color:var(--teal);font-size:.9rem;width:14px;flex-shrink:0;margin-top:1px;}
.evp-footer{padding:10px 14px;border-top:1px solid var(--gray-border);display:flex;gap:6px;}
.evp-btn{flex:1;border:none;border-radius:6px;padding:6px;font-size:.72rem;font-weight:700;cursor:pointer;transition:all .15s;}
.evp-btn-primary{background:var(--teal);color:white;}
.evp-btn-primary:hover{background:var(--teal-dark);}
.evp-btn-secondary{background:var(--slate-light);color:var(--slate);border:1px solid var(--gray-border);}
#ev-backdrop{position:fixed;inset:0;z-index:299;display:none;}

/* ══ MODAL BASE ══ */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:400;display:none;align-items:flex-end;justify-content:center;}
.modal-overlay.open{display:flex;}
.modal-sheet{background:white;border-radius:20px 20px 0 0;width:480px;max-width:100vw;max-height:90vh;overflow-y:auto;animation:slideUp .22s ease-out;padding-bottom:20px;}
.modal-sheet::-webkit-scrollbar{display:none;}
@keyframes slideUp{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-handle{width:38px;height:4px;background:#e2e8f0;border-radius:2px;margin:12px auto 0;}
.modal-topbar{display:flex;align-items:center;padding:12px 20px 8px;}
.modal-topbar h5{font-family:var(--font-display);font-weight:900;font-size:.95rem;flex:1;text-align:center;margin:0;color:var(--slate);}
.modal-close-btn{background:none;border:none;cursor:pointer;color:#94a3b8;font-size:1.1rem;width:28px;height:28px;border-radius:6px;display:grid;place-items:center;}
.modal-close-btn:hover{background:var(--slate-light);}
.modal-body{padding:0 20px;}
.modal-section{margin-bottom:16px;}
.modal-section-title{font-size:.65rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:#94a3b8;margin-bottom:8px;}
.mf-label{font-size:.73rem;font-weight:700;color:var(--slate);display:block;margin-bottom:4px;}
.mf-input{width:100%;border:1.5px solid var(--gray-border);border-radius:8px;padding:8px 11px;font-family:var(--font-body);font-size:.8rem;color:var(--slate);transition:border-color .15s;}
.mf-input:focus{outline:none;border-color:var(--teal);}
.mf-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.mf-group{margin-bottom:12px;}
.mf-textarea{width:100%;border:1.5px solid var(--gray-border);border-radius:8px;padding:8px 11px;font-family:var(--font-body);font-size:.8rem;color:var(--slate);resize:none;min-height:80px;}
.mf-textarea:focus{outline:none;border-color:var(--teal);}
/* Shift cards inside modal */
.shift-card-select{border:1.5px solid var(--gray-border);border-radius:9px;padding:11px 13px;display:flex;align-items:center;gap:10px;cursor:pointer;transition:all .15s;margin-bottom:7px;}
.shift-card-select:hover,.shift-card-select.selected{border-color:var(--teal);background:var(--teal-light);}
.scs-bar{width:4px;border-radius:2px;align-self:stretch;}
.scs-name{font-weight:800;font-size:.82rem;color:var(--slate);}
.scs-time{font-size:.73rem;color:#94a3b8;margin-top:2px;}
.scs-date{background:var(--red);color:white;border-radius:6px;padding:3px 8px;text-align:center;flex-shrink:0;}
.scs-date .sd-m{font-size:.55rem;font-weight:800;text-transform:uppercase;}
.scs-date .sd-d{font-size:.95rem;font-weight:900;line-height:1;}
/* Vacation calendar */
.vac-cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:6px;}
.vac-day-name{font-size:.6rem;font-weight:800;text-align:center;color:#94a3b8;padding:2px 0;}
.vac-day{height:28px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:600;cursor:pointer;transition:all .15s;border:1.5px solid transparent;color:var(--slate);}
.vac-day:hover{background:var(--teal-light);color:var(--teal);}
.vac-day.start{background:var(--teal);color:white;border-color:var(--teal);}
.vac-day.end{background:var(--teal);color:white;border-color:var(--teal);}
.vac-day.in-range{background:var(--teal-light);color:var(--teal-dark);}
.vac-day.other{color:#e2e8f0;}
.vac-day.disabled{opacity:.35;cursor:not-allowed;pointer-events:none;}
.vac-summary-box{background:var(--teal-light);border:1.5px solid var(--teal-mid);border-radius:8px;padding:10px 13px;margin-top:10px;font-size:.78rem;color:var(--teal-dark);}
.vac-days-counter{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;}
.vdc-box{background:var(--white);border:1px solid var(--gray-border);border-radius:8px;padding:10px;text-align:center;}
.vdc-val{font-family:var(--font-display);font-weight:900;font-size:1.2rem;}
.vdc-label{font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#94a3b8;margin-top:2px;}
/* Confirm btn */
.btn-confirm{width:calc(100% - 40px);margin:14px 20px 0;background:var(--slate);color:white;border:none;border-radius:11px;padding:13px;font-size:.88rem;font-weight:700;cursor:pointer;font-family:var(--font-body);transition:all .15s;}
.btn-confirm:hover{background:#1e293b;}
.btn-confirm.teal{background:var(--teal);}
.btn-confirm.teal:hover{background:var(--teal-dark);}

/* Toast */
.pv-toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--slate);color:white;padding:10px 22px;border-radius:22px;font-size:.8rem;font-weight:700;z-index:999;box-shadow:var(--shadow-lg);opacity:0;transition:opacity .25s;pointer-events:none;}
.pv-toast.show{opacity:1;}
</style>
</head>

<div class="vet-layout">

    <!-- View bar -->

<!-- ══ EVENT BACKDROP ══ -->
<div id="ev-backdrop" onclick="closePopup()"></div>

</div>

<!-- Toast -->
<div class="pv-toast" id="pvToast"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
/* ══════════════════════════════════
   DATA
══════════════════════════════════ */
const TODAY = new Date();
TODAY.setHours(0,0,0,0);

function ds(offset=0){
  const d=new Date(TODAY); d.setDate(d.getDate()+offset);
  return d.toISOString().slice(0,10);
}

const EVENTS=[
  // Today
  {id:1,title:'Max — Rodríguez',type:'Primera consulta',date:ds(0),startH:8,endH:9,color:'ev-teal',patient:'Max',owner:'Familia Rodríguez',species:'Perro · Golden Retriever · 3 años',notes:'Control de peso y vacuna anual'},
  {id:2,title:'Luna — García',type:'Control postoperatorio',date:ds(0),startH:9.5,endH:10.5,color:'ev-pink',patient:'Luna',owner:'Ana García',species:'Gato · Persa · 5 años',notes:'Revisión herida quirúrgica'},
  {id:3,title:'Rocky — Pérez',type:'Urgencia',date:ds(0),startH:11,endH:12,color:'ev-red',patient:'Rocky',owner:'Carlos Pérez',species:'Perro · Bulldog · 4 años',notes:'Vómitos y decaimiento'},
  {id:4,title:'ALMUERZO',type:'Descanso',date:ds(0),startH:13,endH:14,color:'ev-slate',patient:'',owner:'',species:'',notes:''},
  {id:5,title:'Misi — Torres',type:'Vacunación',date:ds(0),startH:14.5,endH:15,color:'ev-green',patient:'Misi',owner:'Pedro Torres',species:'Gato · Doméstico · 2 años',notes:'Vacuna polivalente + antirrábica'},
  {id:6,title:'Simba — Vega',type:'Segunda consulta',date:ds(0),startH:16,endH:17,color:'ev-amber',patient:'Simba',owner:'Laura Vega',species:'Perro · Labrador · 7 años',notes:'Seguimiento diabetes'},
  // Tomorrow
  {id:7,title:'Kira — Muñoz',type:'Cirugía',date:ds(1),startH:8,endH:11,color:'ev-purple',patient:'Kira',owner:'Sofía Muñoz',species:'Perra · Schnauzer · 6 años',notes:'Esterilización programada'},
  {id:8,title:'Toby — Salas',type:'Control',date:ds(1),startH:12,endH:13,color:'ev-teal',patient:'Toby',owner:'Ricardo Salas',species:'Perro · Beagle · 2 años',notes:''},
  {id:9,title:'Pelusa — Castro',type:'Vacunación',date:ds(1),startH:15,endH:15.5,color:'ev-green',patient:'Pelusa',owner:'Diana Castro',species:'Conejo · 1 año',notes:''},
  // Day after
  {id:10,title:'Libre (guardia)',type:'Turno guardia',date:ds(2),startH:8,endH:14,color:'ev-sky',patient:'',owner:'',species:'',notes:'Guardia mañana'},
  {id:11,title:'Nala — Ramos',type:'Ecografía',date:ds(2),startH:15,endH:16,color:'ev-amber',patient:'Nala',owner:'Valentina Ramos',species:'Perra · Golden · 8 años',notes:'Ecografía abdominal'},
  // Day 3
  {id:12,title:'Rex — Flores',type:'Primera consulta',date:ds(3),startH:9,endH:10,color:'ev-teal',patient:'Rex',owner:'Jorge Flores',species:'Perro · Pastor · 1 año',notes:'Revisión general cachorro'},
  {id:13,title:'Reunión de equipo',type:'Administrativa',date:ds(3),startH:12,endH:13,color:'ev-slate',patient:'',owner:'',species:'',notes:'Sala de reuniones'},
  {id:14,title:'Mochi — Ibáñez',type:'Control',date:ds(3),startH:14,endH:14.5,color:'ev-pink',patient:'Mochi',owner:'Camila Ibáñez',species:'Gato · Siamés · 4 años',notes:''},
  // Day 4
  {id:15,title:'Capitán — Ríos',type:'Cirugía',date:ds(4),startH:8,endH:10,color:'ev-purple',patient:'Capitán',owner:'Martín Ríos',species:'Perro · Gran Danés · 3 años',notes:'Extracción molar'},
  {id:16,title:'Nico — Soto',type:'Segunda consulta',date:ds(4),startH:11,endH:12,color:'ev-amber',patient:'Nico',owner:'Paula Soto',species:'Perro · Cocker · 5 años',notes:'Dermatitis'},
  // Day 5
  {id:17,title:'LIBRE',type:'Día libre',date:ds(5),startH:8,endH:18,color:'ev-slate',patient:'',owner:'',species:'',notes:''},
  // Day 6
  {id:18,title:'Cleo — Vargas',type:'Vacunación',date:ds(6),startH:10,endH:10.5,color:'ev-green',patient:'Cleo',owner:'Isabel Vargas',species:'Gata · Mestiza · 3 años',notes:''},
  {id:19,title:'Zeus — Herrera',type:'Control',date:ds(6),startH:11.5,endH:12.5,color:'ev-teal',patient:'Zeus',owner:'Diego Herrera',species:'Perro · Rottweiler · 4 años',notes:'Control post-vacuna'},
];

const HOUR_PX = 60;
const START_H = 7;
const MONTHS_ES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const DAYS_SHORT = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];

let currentView = 'day';
let currentDate = new Date(TODAY);

/* ══ HELPERS ══ */
function dStr(d){ return d.toISOString().slice(0,10); }
function fmtH(h){ const hh=Math.floor(h),mm=Math.round((h-hh)*60); return `${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}`; }
function isSameDay(a,b){ return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate(); }
function isToday(d){ return isSameDay(d,TODAY); }
function getMonday(d){ const day=d.getDay(); const diff=day===0?-6:1-day; const m=new Date(d); m.setDate(d.getDate()+diff); m.setHours(0,0,0,0); return m; }

/* ══ SUMMARY ══ */
function renderSummary(){
  const todayEvs = EVENTS.filter(e=>e.date===dStr(TODAY)&&e.type!=='Descanso'&&e.type!=='Día libre');
  const weekStart = getMonday(TODAY);
  const weekEnd = new Date(weekStart); weekEnd.setDate(weekStart.getDate()+6);
  let weekCount=0;
  for(let d=new Date(weekStart);d<=weekEnd;d.setDate(d.getDate()+1)){
    weekCount+=EVENTS.filter(e=>e.date===dStr(new Date(d))&&e.type!=='Descanso'&&e.type!=='Día libre').length;
  }
  const surgeries=EVENTS.filter(e=>e.type==='Cirugía').length;
  const nextEvent=EVENTS.filter(e=>{
    const [y,m,da]=e.date.split('-').map(Number);
    const evDate=new Date(y,m-1,da);
    return evDate>=TODAY && e.type!=='Descanso' && e.type!=='Día libre';
  }).sort((a,b)=>a.date.localeCompare(b.date)||a.startH-b.startH)[0];

  document.getElementById('summaryRow').innerHTML=`
    <div class="sum-card"><div class="sum-icon" style="background:#e6f7f5;"><i class="bi bi-calendar-check-fill" style="color:var(--teal);"></i></div>
      <div><div class="sum-label">Citas hoy</div><div class="sum-value">${todayEvs.length}</div><div class="sum-sub">${fmtH(8)} – ${fmtH(18)}</div></div></div>
    <div class="sum-card"><div class="sum-icon" style="background:#fef3c7;"><i class="bi bi-calendar3-week-fill" style="color:var(--amber);"></i></div>
      <div><div class="sum-label">Esta semana</div><div class="sum-value">${weekCount}</div><div class="sum-sub">consultas programadas</div></div></div>
    <div class="sum-card"><div class="sum-icon" style="background:#ede9fe;"><i class="bi bi-scissors" style="color:var(--purple);"></i></div>
      <div><div class="sum-label">Cirugías</div><div class="sum-value">${surgeries}</div><div class="sum-sub">próximas 2 semanas</div></div></div>
    <div class="sum-card"><div class="sum-icon" style="background:#e0f2fe;"><i class="bi bi-clock-fill" style="color:var(--sky);"></i></div>
      <div><div class="sum-label">Próxima cita</div><div class="sum-value" style="font-size:1rem;">${nextEvent?nextEvent.title.split('—')[0].trim():'—'}</div>
        <div class="sum-sub">${nextEvent?fmtH(nextEvent.startH)+' · '+nextEvent.type:'Sin citas'}</div></div></div>`;
  document.getElementById('topbarSub').textContent = `${DAYS_SHORT[TODAY.getDay()===0?6:TODAY.getDay()-1]}, ${TODAY.getDate()} de ${MONTHS_ES[TODAY.getMonth()]} · ${todayEvs.length} citas hoy`;
}

/* ══ VIEW CONTROL ══ */
function setView(v,btn){
  currentView=v;
  document.querySelectorAll('.view-tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  render();
}
function goToday(){ currentDate=new Date(TODAY); render(); }
function navPrev(){
  if(currentView==='day') currentDate.setDate(currentDate.getDate()-1);
  else if(currentView==='week') currentDate.setDate(currentDate.getDate()-7);
  else currentDate.setMonth(currentDate.getMonth()-1);
  render();
}
function navNext(){
  if(currentView==='day') currentDate.setDate(currentDate.getDate()+1);
  else if(currentView==='week') currentDate.setDate(currentDate.getDate()+7);
  else currentDate.setMonth(currentDate.getMonth()+1);
  render();
}

function render(){
  closePopup();
  if(currentView==='day') renderDay();
  else if(currentView==='week') renderWeek();
  else renderMonth();
}

/* ══ DAY VIEW ══ */
function renderDay(){
  const d=currentDate;
  const ds2=dStr(d);
  const evs=EVENTS.filter(e=>e.date===ds2);
  const isT=isToday(d);
  const dayName=DAYS_SHORT[d.getDay()===0?6:d.getDay()-1];
  document.getElementById('periodLabel').textContent=`${dayName}, ${d.getDate()} de ${MONTHS_ES[d.getMonth()]} de ${d.getFullYear()}`;

  const nowH = new Date().getHours() + new Date().getMinutes()/60;
  const hours=[];
  for(let h=START_H;h<=21;h++) hours.push(h);

  const container=document.getElementById('calContainer');
  container.innerHTML='';

  const grid=document.createElement('div');
  grid.className='day-view';

  // Timeline
  const tl=document.createElement('div');
  tl.className='day-timeline';
  tl.innerHTML=`<div class="timeline-header">
    <div class="timeline-date-big">${d.getDate()}</div>
    <div><div class="timeline-day-name">${dayName}${isT?' — Hoy':''}</div>
      <div class="timeline-date-sub">${MONTHS_ES[d.getMonth()]} ${d.getFullYear()}</div></div>
  </div>`;

  const body=document.createElement('div');
  body.className='timeline-body';

  // Turno banner
  const turno=document.createElement('div');
  turno.style.cssText='padding:8px 12px;background:#f0fdf4;border-bottom:1px solid #bbf7d0;display:flex;align-items:center;gap:8px;font-size:.75rem;';
  turno.innerHTML=`<i class="bi bi-clock-fill" style="color:var(--green);"></i><strong style="color:var(--green);">Turno: 08:00 – 18:00</strong><span style="color:#94a3b8;margin-left:4px;">· Sucursal Casa Matriz</span>`;
  body.appendChild(turno);

  hours.forEach(h=>{
    const row=document.createElement('div');
    row.className='tl-row';
    row.innerHTML=`<div class="tl-time">${h}:00</div><div class="tl-slot" id="tslot-${h}"></div>`;
    body.appendChild(row);
    // now line
    if(isT && Math.floor(nowH)===h){
      const slot=row.querySelector('.tl-slot');
      const nl=document.createElement('div');
      nl.className='tl-now-line';
      nl.style.marginTop=((nowH-h)*60)+'px';
      slot.appendChild(nl);
    }
  });

  // Place events
  evs.forEach(ev=>{
    const slot=body.querySelector(`#tslot-${Math.floor(ev.startH)}`);
    if(!slot) return;
    const el=document.createElement('div');
    el.className=`tl-event ${ev.color}`;
    el.style.marginTop=((ev.startH-Math.floor(ev.startH))*60)+'px';
    const typeBadge={Cirugía:'ev-purple',Urgencia:'ev-red',Vacunación:'ev-green',Descanso:'ev-slate','Día libre':'ev-slate',Administrativa:'ev-slate'}[ev.type]||'ev-teal';
    el.innerHTML=`<div class="tl-ev-title">${ev.title}</div>
      <div class="tl-ev-type">${ev.type}${ev.species?` · ${ev.species}`:''}${ev.notes?` — ${ev.notes}`:''}</div>
      <div class="tl-ev-time"><i class="bi bi-clock" style="font-size:.6rem;"></i> ${fmtH(ev.startH)} – ${fmtH(ev.endH)}</div>`;
    el.onclick=(e)=>{e.stopPropagation();showPopup(ev,e);};
    slot.appendChild(el);
  });

  tl.appendChild(body);
  grid.appendChild(tl);

  // Right panel
  const right=document.createElement('div');
  right.className='day-right';

  // Turno card
  right.innerHTML+=`<div class="info-card">
    <div class="ic-title"><i class="bi bi-clock-fill"></i> Tu turno de hoy</div>
    <div class="turno-badge"><i class="bi bi-building"></i>
      <div><div class="tb-label">Turno</div><div class="tb-value">08:00 – 18:00</div></div>
    </div>
    <div style="font-size:.72rem;color:#94a3b8;display:flex;gap:12px;flex-wrap:wrap;">
      <span><i class="bi bi-geo-alt-fill" style="color:var(--teal);"></i> Sucursal Casa Matriz</span>
      <span><i class="bi bi-people-fill" style="color:var(--teal);"></i> ${evs.filter(e=>e.type!=='Descanso'&&e.type!=='Día libre').length} pacientes</span>
    </div>
  </div>`;

  // Next appointments
  const upcomingEvs=evs.filter(e=>e.type!=='Descanso'&&e.type!=='Día libre').sort((a,b)=>a.startH-b.startH);
  const upCard=document.createElement('div');
  upCard.className='info-card';
  upCard.innerHTML=`<div class="ic-title"><i class="bi bi-list-check"></i> Citas del día (${upcomingEvs.length})</div>`+
    (upcomingEvs.length===0?'<div style="font-size:.75rem;color:#94a3b8;text-align:center;padding:10px 0;">Sin citas programadas</div>':
    upcomingEvs.map(ev=>`
      <div class="next-event">
        <div class="ne-dot" style="background:${getBgColor(ev.color)};"></div>
        <div style="flex:1;">
          <div class="ne-title">${ev.title}</div>
          <div class="ne-meta">${ev.type}${ev.species?' · '+ev.species:''}</div>
        </div>
        <div class="ne-time">${fmtH(ev.startH)}</div>
      </div>`).join(''));
  right.appendChild(upCard);

  // Type breakdown
  const types={};
  upcomingEvs.forEach(e=>{types[e.type]=(types[e.type]||0)+1;});
  if(Object.keys(types).length>0){
    const bcard=document.createElement('div');
    bcard.className='info-card';
    bcard.innerHTML=`<div class="ic-title"><i class="bi bi-pie-chart-fill"></i> Por tipo</div>`+
      Object.entries(types).map(([t,c])=>`
        <div style="display:flex;align-items:center;justify-content:space-between;padding:4px 0;font-size:.75rem;border-bottom:1px dashed var(--gray-border);">
          <span style="color:var(--slate);">${t}</span>
          <span style="font-weight:800;color:var(--teal);">${c}</span>
        </div>`).join('');
    right.appendChild(bcard);
  }

  grid.appendChild(right);
  container.appendChild(grid);
}

function getBgColor(cls){
  const map={
    'ev-teal':'#1a9e8f','ev-pink':'#f472b6','ev-amber':'#f59e0b',
    'ev-purple':'#7c3aed','ev-sky':'#0ea5e9','ev-green':'#16a34a',
    'ev-red':'#dc2626','ev-slate':'#64748b'
  };
  return map[cls]||'#1a9e8f';
}

/* ══ WEEK VIEW ══ */
function renderWeek(){
  const ws=getMonday(currentDate);
  const days=[];
  for(let i=0;i<7;i++){const d=new Date(ws);d.setDate(ws.getDate()+i);days.push(d);}
  const we=days[6];
  document.getElementById('periodLabel').textContent=
    `${MONTHS_ES[ws.getMonth()]} ${ws.getDate()} – ${we.getDate()} de ${MONTHS_ES[we.getMonth()]} ${ws.getFullYear()}`;

  const hours=[];
  for(let h=START_H;h<=20;h++) hours.push(h);

  const container=document.getElementById('calContainer');
  container.innerHTML='';

  const wv=document.createElement('div');
  wv.className='week-view';

  // Header
  const hdrWrap=document.createElement('div');
  hdrWrap.style.cssText='display:flex;border-bottom:1px solid var(--gray-border);background:var(--slate-light);position:sticky;top:0;z-index:5;';
  hdrWrap.innerHTML=`<div style="width:56px;flex-shrink:0;border-right:1px solid var(--gray-border);"></div>`;
  days.forEach(d=>{
    const isT=isToday(d);
    const dn=DAYS_SHORT[d.getDay()===0?6:d.getDay()-1];
    const evCnt=EVENTS.filter(e=>e.date===dStr(d)&&e.type!=='Descanso'&&e.type!=='Día libre').length;
    hdrWrap.innerHTML+=`<div class="wch-day${isT?' today':''}" style="flex:1;text-align:center;padding:8px 4px;border-right:1px solid var(--gray-border);cursor:pointer;" onclick="jumpToDay('${dStr(d)}')">
      <div class="dn">${dn}</div>
      <div class="dd">${d.getDate()}</div>
      ${evCnt>0?`<div style="font-size:.6rem;color:var(--teal);font-weight:800;">${evCnt} cita${evCnt>1?'s':''}</div>`:''}
    </div>`;
  });
  wv.appendChild(hdrWrap);

  // Body
  const bodyWrap=document.createElement('div');
  bodyWrap.className='week-body';

  // Times col
  const timesCol=document.createElement('div');
  timesCol.className='wb-times';
  hours.forEach(h=>{
    const c=document.createElement('div');
    c.className='wb-time-cell';
    c.innerHTML=`<span>${h}:00</span>`;
    timesCol.appendChild(c);
  });
  bodyWrap.appendChild(timesCol);

  // Days
  const daysWrap=document.createElement('div');
  daysWrap.className='wb-days';
  days.forEach(d=>{
    const col=document.createElement('div');
    col.className='wb-day-col';
    const isT=isToday(d);
    if(isT) col.style.background='rgba(26,158,143,.02)';
    // hour lines
    hours.forEach(()=>{
      const l=document.createElement('div');
      l.className='wb-hour-line';
      col.appendChild(l);
    });
    // events
    EVENTS.filter(e=>e.date===dStr(d)).forEach(ev=>{
      const top=((ev.startH-START_H)*HOUR_PX);
      const height=Math.max(22,(ev.endH-ev.startH)*HOUR_PX-3);
      const el=document.createElement('div');
      el.className=`wk-event ${ev.color}`;
      el.style.cssText=`top:${top}px;height:${height}px;`;
      el.innerHTML=`<div class="wk-ev-title">${ev.title}</div><div class="wk-ev-time">${fmtH(ev.startH)}</div>`;
      el.onclick=(e)=>{e.stopPropagation();showPopup(ev,e);};
      col.appendChild(el);
    });
    daysWrap.appendChild(col);
  });
  bodyWrap.appendChild(daysWrap);
  wv.appendChild(bodyWrap);
  container.appendChild(wv);
}

function jumpToDay(ds2){
  currentDate=new Date(ds2+'T12:00:00');
  setView('day',document.querySelector('.view-tab'));
  document.querySelectorAll('.view-tab').forEach((t,i)=>{if(i===0)t.classList.add('active');else t.classList.remove('active');});
}

/* ══ MONTH VIEW ══ */
function renderMonth(){
  const y=currentDate.getFullYear(), m=currentDate.getMonth();
  document.getElementById('periodLabel').textContent=`${MONTHS_ES[m]} ${y}`;

  const container=document.getElementById('calContainer');
  container.innerHTML='';
  const mv=document.createElement('div');
  mv.className='month-view';

  // DOW row
  const dowRow=document.createElement('div');
  dowRow.className='month-dow-row';
  DAYS_SHORT.forEach(d=>{dowRow.innerHTML+=`<div class="month-dow">${d}</div>`;});
  mv.appendChild(dowRow);

  // Grid
  const grid=document.createElement('div');
  grid.className='month-grid';
  const firstDay=new Date(y,m,1).getDay();
  const startOffset=firstDay===0?6:firstDay-1;
  const daysInM=new Date(y,m+1,0).getDate();
  const prevDays=new Date(y,m,0).getDate();

  const cells=[];
  for(let i=startOffset-1;i>=0;i--) cells.push({day:prevDays-i,cur:false,date:new Date(y,m-1,prevDays-i)});
  for(let d=1;d<=daysInM;d++) cells.push({day:d,cur:true,date:new Date(y,m,d)});
  const rem=(7-cells.length%7)%7;
  for(let d=1;d<=rem;d++) cells.push({day:d,cur:false,date:new Date(y,m+1,d)});

  cells.forEach(c=>{
    const cell=document.createElement('div');
    cell.className='month-cell';
    const isT=isToday(c.date);
    cell.innerHTML=`<div class="mc-day-num${isT?' today':''}${!c.cur?' other':''}">${c.day}</div>`;
    const dayEvs=EVENTS.filter(e=>e.date===dStr(c.date));
    // work bar
    if(c.cur && dayEvs.some(e=>e.type!=='Día libre')){
      const bar=document.createElement('div');
      bar.className='mc-work-bar';
      bar.style.background=dayEvs.some(e=>e.type==='Cirugía')?'var(--purple)':dayEvs.some(e=>e.type==='Urgencia')?'var(--red)':'var(--teal)';
      cell.appendChild(bar);
    }
    dayEvs.slice(0,2).forEach(ev=>{
      const el=document.createElement('div');
      el.className=`mc-event ${ev.color}`;
      el.textContent=ev.title;
      el.onclick=(e)=>{e.stopPropagation();showPopup(ev,e);};
      cell.appendChild(el);
    });
    if(dayEvs.length>2){
      const more=document.createElement('div');
      more.style.cssText='font-size:.6rem;color:#94a3b8;padding:1px 3px;';
      more.textContent=`+${dayEvs.length-2} más`;
      cell.appendChild(more);
    }
    cell.onclick=()=>jumpToDay(dStr(c.date));
    grid.appendChild(cell);
  });
  mv.appendChild(grid);
  container.appendChild(mv);
}

/* ══ EVENT POPUP ══ */
let openPopup=null;
function showPopup(ev, mouseEvent){
  closePopup();
  const popup=document.createElement('div');
  popup.className='ev-popup';
  popup.id='evPopup';
  const barColor=getBgColor(ev.color);
  popup.innerHTML=`
    <div class="evp-head">
      <div class="evp-color-bar" style="background:${barColor};"></div>
      <div style="flex:1;">
        <div class="evp-title">${ev.title}</div>
        <div class="evp-type">${ev.type}</div>
      </div>
      <button class="evp-close" onclick="closePopup()"><i class="bi bi-x-lg"></i></button>
    </div>
    <div class="evp-body">
      <div class="evp-row"><i class="bi bi-clock"></i><span>${fmtH(ev.startH)} – ${fmtH(ev.endH)}</span></div>
      ${ev.species?`<div class="evp-row"><i class="bi bi-heart-pulse"></i><span>${ev.species}</span></div>`:''}
      ${ev.owner?`<div class="evp-row"><i class="bi bi-person"></i><span>Propietario: ${ev.owner}</span></div>`:''}
      ${ev.notes?`<div class="evp-row"><i class="bi bi-chat-left-text"></i><span>${ev.notes}</span></div>`:''}
    </div>
    <div class="evp-footer">
      ${ev.patient?`<button class="evp-btn evp-btn-primary" onclick="closePopup();showToast('Abriendo ficha de ${ev.patient}…')">
        <i class="bi bi-clipboard2-pulse"></i> Ver ficha
      </button>`:''} 
      <button class="evp-btn evp-btn-secondary" onclick="closePopup()">Cerrar</button>
    </div>`;
  document.body.appendChild(popup);
  document.getElementById('ev-backdrop').style.display='block';
  // Position
  const x=mouseEvent.clientX, y=mouseEvent.clientY;
  let left=x+12, top=y-10;
  if(left+300>window.innerWidth) left=x-310;
  if(top+300>window.innerHeight) top=window.innerHeight-310;
  popup.style.left=Math.max(8,left)+'px';
  popup.style.top=Math.max(8,top)+'px';
  openPopup=popup;
}
function closePopup(){
  const p=document.getElementById('evPopup');
  if(p) p.remove();
  document.getElementById('ev-backdrop').style.display='none';
}

/* ══ SWAP MODAL ══ */
function openSwap(){
  const now=new Date();
  document.getElementById('swap-cur-month').textContent=MONTHS_ES[now.getMonth()].slice(0,3).toUpperCase();
  document.getElementById('swap-cur-day').textContent=now.getDate();
  document.getElementById('swapOverlay').classList.add('open');
}
function closeSwap(){ document.getElementById('swapOverlay').classList.remove('open'); }
function pickSwap(el){
  document.querySelectorAll('.shift-card-select[id^="swp"]').forEach(x=>x.classList.remove('selected'));
  el.classList.add('selected');
}
function confirmSwap(){
  closeSwap();
  showToast('Solicitud de cambio enviada ✓ — Pendiente de aprobación');
}

/* ══ VACACIONES MODAL ══ */
let vacMonthDate=new Date(TODAY.getFullYear(),TODAY.getMonth(),1);
let vacStart=null,vacEnd=null;

function openVacaciones(){
  vacMonthDate=new Date(TODAY.getFullYear(),TODAY.getMonth(),1);
  vacStart=null;vacEnd=null;
  renderVacCal();
  document.getElementById('vacOverlay').classList.add('open');
}
function closeVacaciones(){ document.getElementById('vacOverlay').classList.remove('open'); }
function vacPrevMonth(){vacMonthDate.setMonth(vacMonthDate.getMonth()-1);renderVacCal();}
function vacNextMonth(){vacMonthDate.setMonth(vacMonthDate.getMonth()+1);renderVacCal();}

function renderVacCal(){
  const y=vacMonthDate.getFullYear(),m=vacMonthDate.getMonth();
  document.getElementById('vacMonthLabel').textContent=`${MONTHS_ES[m]} ${y}`;
  const grid=document.getElementById('vacCalGrid');
  grid.innerHTML='';
  DAYS_SHORT.forEach(d=>{ grid.innerHTML+=`<div class="vac-day-name">${d[0]}</div>`; });
  const firstDay=new Date(y,m,1).getDay();
  const startOffset=firstDay===0?6:firstDay-1;
  const daysInM=new Date(y,m+1,0).getDate();
  const prevDays=new Date(y,m,0).getDate();
  for(let i=startOffset-1;i>=0;i--){
    grid.innerHTML+=`<div class="vac-day other">${prevDays-i}</div>`;
  }
  for(let d=1;d<=daysInM;d++){
    const dt=new Date(y,m,d);
    const isPast=dt<TODAY;
    let cls='vac-day';
    if(isPast) cls+=' disabled';
    else{
      if(vacStart&&dStr(dt)===dStr(vacStart)) cls+=' start';
      else if(vacEnd&&dStr(dt)===dStr(vacEnd)) cls+=' end';
      else if(vacStart&&vacEnd&&dt>vacStart&&dt<vacEnd) cls+=' in-range';
    }
    grid.innerHTML+=`<div class="${cls}" onclick="pickVacDay(${y},${m},${d})">${d}</div>`;
  }
  const rem=(7-(startOffset+daysInM)%7)%7;
  for(let d=1;d<=rem;d++) grid.innerHTML+=`<div class="vac-day other">${d}</div>`;
  renderVacSummary();
}

function pickVacDay(y,m,d){
  const dt=new Date(y,m,d);
  if(!vacStart||vacEnd){vacStart=dt;vacEnd=null;}
  else if(dt>vacStart){vacEnd=dt;}
  else{vacStart=dt;vacEnd=null;}
  renderVacCal();
}

function renderVacSummary(){
  const sumBox=document.getElementById('vacSummary');
  if(vacStart&&vacEnd){
    const diff=Math.round((vacEnd-vacStart)/(1000*60*60*24))+1;
    const workDays=countWorkDays(vacStart,vacEnd);
    document.getElementById('vacSummaryText').innerHTML=
      `📅 <strong>${vacStart.getDate()} de ${MONTHS_ES[vacStart.getMonth()]}</strong> → <strong>${vacEnd.getDate()} de ${MONTHS_ES[vacEnd.getMonth()]}</strong><br>
       🗓 ${diff} días totales · <strong>${workDays} días hábiles descontados</strong>`;
    sumBox.style.display='block';
  } else if(vacStart){
    document.getElementById('vacSummaryText').innerHTML=`📅 Inicio: <strong>${vacStart.getDate()} de ${MONTHS_ES[vacStart.getMonth()]}</strong> — Selecciona fecha de fin`;
    sumBox.style.display='block';
  } else {
    sumBox.style.display='none';
  }
}

function countWorkDays(start,end){
  let count=0;
  const d=new Date(start);
  while(d<=end){const day=d.getDay();if(day!==0&&day!==6)count++;d.setDate(d.getDate()+1);}
  return count;
}

function confirmVacaciones(){
  if(!vacStart||!vacEnd){showToast('Selecciona el período de vacaciones','warn');return;}
  closeVacaciones();
  showToast('Solicitud de vacaciones enviada ✓ — Pendiente de aprobación');
}

/* ══ MODAL HELPERS ══ */
function closeBg(e,id){ if(e.target===document.getElementById(id)) document.getElementById(id).classList.remove('open'); }
function toggleSidebar(){
  document.getElementById('vetSidebar').classList.toggle('open');
  document.getElementById('vetOverlay').classList.toggle('open');
}

/* ══ TOAST ══ */
function showToast(msg){
  const t=document.getElementById('pvToast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2500);
}

/* ══ ESC ══ */
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    closePopup();
    document.getElementById('swapOverlay').classList.remove('open');
    document.getElementById('vacOverlay').classList.remove('open');
  }
});

/* ══ INIT ══ */
renderSummary();
render();
</script>
